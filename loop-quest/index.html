nd your way around FL: the five main windows, the keys that open them, and the Loop Quest script that checks your work.",quests:[{id:"w0-1",engine:"keydrill",title:"Window Warp",short:"Warp",xp:40,brief:"Welcome to the studio. First rule: hands on the keys. When I call a window, hit the key that opens it.",lesson:"FL Studio has five main windows, and each has a key that shows or hides it: F5 Playlist, F6 Channel Rack, F7 Piano Roll, F9 Mixer and Alt+F8 Browser.",tip:"Some browsers grab F-keys (F5 reloads, F6 jumps to the address bar). If a key misbehaves here, click it on screen instead. In FL they all work.",cfg:{mode:"keys",pool:["playlist","rack","piano","mixer","browser"],rounds:10,show:"always",par:[25,45]}},{id:"w0-2",engine:"keydrill",title:"Window Spotter",short:"Spot",xp:40,brief:"Now by sight. I'll flash a window, you tell me which one it is.",lesson:"Channel Rack: rows of step buttons. Piano Roll: a keyboard down the side with notes on a grid. Playlist: tracks with clips along a timeline. Mixer: strips with faders. Browser: a folder tree of sounds.",tip:"In FL, Tab cycles through the open windows and F12 closes them all.",cfg:{mode:"choice",rounds:8}},{id:"w0-map",engine:"hotspot",title:"Studio Map",short:"Map",xp:40,brief:"Before you touch a key, learn the room. Explore FL's main window, then find each part when I name it.",lesson:"FL's main window has a toolbar across the top (hint bar, transport, tempo, pattern selector), the Browser down the left and the Playlist filling the middle. Other windows float on top.",tip:"Lost a window? F12 closes them all; then F5, F6, F7 and F9 bring each one back.",cfg:{scene:"main"}},{id:"w0-3",engine:"flquest",title:"Hello, FL",short:"Hello",xp:100,brief:"Now your real FL Studio. Install the Loop Quest script, name a pattern LQ01 and press Space. I'll know it worked.",lesson:"Real-FL quests use a small script inside FL. It reads your project, guides you in FL's hint bar and shows a claim code when you finish. It never changes your project.",tip:"To rename a pattern, pick it in the Pattern selector in FL's toolbar and press F2.",cfg:{tag:"lq01",steps:["Install the script from the FL setup page, then restart FL Studio.","Select a pattern, press F2 and name it LQ01.","Press Space. The hint bar shows your claim code."]}},{id:"w0-4",engine:"flquest",title:"Window Warp in FL",short:"FL warp",xp:100,brief:"Same drill, real keys. Name your pattern LQ02 and open each window the hint bar calls for.",lesson:"The hint bar asks for 6 windows in a random order. If you wait 4 seconds, it shows the key.",tip:"If your F-keys change brightness or volume instead, hold Fn, or switch your keyboard's function-key setting.",cfg:{tag:"lq02",steps:["Rename your pattern LQ02 (F2).","Open each window the hint bar calls for.","After 6 windows, the hint bar shows your claim code."]}},{id:"w0-boss",engine:"flquest",boss:!0,title:"Studio tour",short:"Tour",xp:250,brief:"Last check before you get keys to the building: metronome, Song and Pattern mode, the Mixer, the Playlist, then play.",lesson:"Ctrl+M toggles the metronome (with the Piano Roll in front it imports a MIDI file instead, so click the Playlist first). L switches between Pattern mode, which loops the current pattern, and Song mode, which plays the Playlist.",tip:"On a Mac, use Cmd wherever FL says Ctrl.",cfg:{tag:"lq03",steps:["Rename your pattern LQ03.","Do each step the hint bar asks for, in order.","Finish by pressing Space to play."]}}]},{id:"w1",num:1,name:"Channel Rack",client:"nova",rank:"Loop maker",icon:"grid",blurb:"Program drums step by step: four on the floor, backbeats, offbeat hats and accents, then build the groove in your own FL.",quests:[{id:"w1-map",engine:"hotspot",title:"Rack Anatomy",short:"Rack",xp:40,brief:"Here's the Channel Rack up close. Learn every control on a channel, because you'll use them all tonight.",lesson:"Each row is a channel: a mute light, pan and volume knobs, the mixer track it plays through, its name button, then its steps.",tip:"FL's Channel Rack has its swing knob in the title bar. Leave it at zero for straight house grooves.",cfg:{scene:"rack"}},{id:"w1-1",engine:"rackrace",title:"Four on the floor",short:"Kick",xp:50,brief:"Every house track starts here. Give me a kick on every beat: steps 1, 5, 9 and 13.",lesson:"A bar has 4 beats, and each beat is 4 steps. So the beats start on steps 1, 5, 9 and 13.",tip:"Press F6 to open FL's Channel Rack. Each row is a sound, and you click steps to turn them on, just like here.",cfg:{bpm:124,rows:["Kick"],target:{Kick:He.Kick},par:[15,35]}},{id:"w1-2",engine:"rackrace",title:"Backbeat",short:"Clap",xp:50,brief:"Now a clap on beats 2 and 4. Hit Listen first, then find the steps by ear.",lesson:"The backbeat lands on beats 2 and 4. Count 1, 2, 3, 4 and clap on 2 and 4.",tip:"Space starts and stops playback in FL Studio too. It works here, so get used to it now.",cfg:{bpm:124,rows:["Kick","Clap"],prefill:{Kick:He.Kick},locked:["Kick"],target:{Kick:He.Kick,Clap:He.Clap},par:[20,45]}},{id:"w1-3",engine:"rackrace",title:"Offbeat hats",short:"Hats",xp:50,brief:"Hats go between the kicks, on the \u201Cand\u201D of each beat. That's the house bounce.",lesson:"The offbeat is halfway through a beat, 2 steps after each kick.",tip:"The tempo lives in FL's top toolbar. House usually sits between 120 and 128 BPM; these races run at 124.",cfg:{bpm:124,rows:["Kick","Clap","Hat"],prefill:{Kick:He.Kick,Clap:He.Clap},locked:["Kick","Clap"],target:He,par:[25,55]}},{id:"w1-4",engine:"rackrace",title:"Accents",short:"Accent",xp:50,brief:"Flat hats sound robotic. Put hats on every 8th note: loud on the offbeats, soft on the beats.",lesson:"Velocity is how hard a note hits. Here, click an empty step for a loud hit, click again for soft, and a third time to clear it.",tip:"In FL every step has a velocity too. Edit it in the Channel Rack's graph editor or in the Piano Roll's velocity lane.",cfg:{bpm:124,rows:["Kick","Clap","Hat"],prefill:{Kick:He.Kick,Clap:He.Clap},locked:["Kick","Clap"],target:{Kick:He.Kick,Clap:He.Clap,Hat:Xt},velocity:{Hat:{loud:[3,7,11,15],soft:[1,5,9,13]}},par:[30,60]}},{id:"w1-5",engine:"rackrace",title:"Full groove",short:"Groove",xp:75,brief:"From the top, no help this time. Kick, clap and hats. Show me you've got it.",lesson:"You know all three parts now. Build them from memory, then check by ear.",tip:"Next up is the real thing: you'll build this exact groove in your own FL Studio.",cfg:{bpm:124,rows:["Kick","Clap","Hat"],target:He,par:[40,90]}},{id:"w1-boss",engine:"flquest",boss:!0,title:"DJ Nova's warm-up groove",short:"Boss",xp:250,brief:"Warm-up set tonight. Build the groove you just learned in your own FL Studio at exactly {tempo} BPM, then send me the claim code.",lesson:"The script checks the Kick, Clap and Hat rows of your Channel Rack and your tempo. In FL it outlines the row that needs fixing.",tip:"If your MIDI keyboard already runs its own FL script, use a virtual port for Loop Quest so the keyboard keeps its controls.",cfg:{tag:"lq04",steps:["Start a new project (File > New). It comes with Kick, Clap, Hat and Snare channels.","Rename the pattern LQ04 (F2).","Program the groove, set the tempo to {tempo} and press Space."]}}]},{id:"w2",num:2,name:"Piano Roll",client:"rico",rank:"Beatmaker",icon:"piano",blurb:"Notes, scales, chords and 808 slides, drawn the way FL's Piano Roll works, then checked in your own Piano Roll.",quests:[{id:"w2-map",engine:"hotspot",title:"Piano Roll Anatomy",short:"Roll",xp:40,brief:"Before we write my hook, learn the Piano Roll: tools up top, keyboard on the left, velocity at the bottom.",lesson:"Notes go on the grid: pitch up and down, time left to right. The tools at the top change what a click does, and the velocity lane sets how hard each note hits.",tip:"Every tool has a key: P draw, B paint, D delete, C slice, E select.",cfg:{scene:"piano"}},{id:"w2-1",engine:"pianoroll",title:"Note Drop",short:"Notes",xp:60,brief:"I need a hook I can rap over. Trace my melody: the faded blocks show where each note goes.",lesson:"Up and down is pitch; left to right is time. Here, pick a note length, then click to draw, or drag right for a longer note. Click a note again to delete it.",tip:"In FL's Piano Roll, P picks the draw tool, D the delete tool, and right-clicking a note deletes it.",cfg:{mode:"copy",voice:"piano",bpm:96,bars:1,cell:1,low:60,high:72,len:2,par:[25,50],target:[{m:60,s:0,l:2},{m:63,s:2,l:2},{m:67,s:4,l:2},{m:65,s:6,l:2},{m:63,s:8,l:4},{m:60,s:12,l:4}]}},{id:"w2-2",engine:"pianoroll",title:"Scale Runner",short:"Scale",xp:60,brief:"Freestyle time. Write any melody you like, but stay in C minor, and start and end on C.",lesson:"C minor uses C, D, E\u266D, F, G, A\u266D and B\u266D. FL shows flats as sharps, so look for D#, G# and A#. Notes outside the scale are dimmed here.",tip:"FL can show a scale in its Piano Roll too: open the Piano Roll menu, then Helpers \u203A Scale highlighting.",cfg:{mode:"scale",voice:"piano",bpm:96,bars:1,cell:1,low:60,high:72,len:2,scale:{root:0,pcs:[0,2,3,5,7,8,10]},minNotes:6}},{id:"w2-3",engine:"pianoroll",title:"Chord Crafter",short:"Chords",xp:60,brief:"Chords under the hook: C minor, A\u266D, E\u266D, then B\u266D. One chord per bar.",lesson:"A triad stacks three notes: a root, a third and a fifth. Any order works (that's an inversion). FL names A\u266D G#, E\u266D D# and B\u266D A#.",tip:"In FL's Piano Roll, Alt+S opens the Strum tool and Ctrl+L makes selected notes legato.",cfg:{mode:"chords",voice:"piano",bpm:90,bars:4,cell:4,low:55,high:79,len:4,chords:[{name:"C minor",pcs:[0,3,7]},{name:"A\u266D major",pcs:[8,0,3]},{name:"E\u266D major",pcs:[3,7,10]},{name:"B\u266D major",pcs:[10,2,5]}]}},{id:"w2-4",engine:"pianoroll",title:"808 Glide Golf",short:"808",xp:60,brief:"Now the 808. A long C, slide it up to D#, then hit C again on step 11. Fewest moves wins.",lesson:"A slide note bends the note under it to its own pitch over the slide note's length. It has to overlap the note it bends, and in FL it must be the same note color.",tip:"In FL's Piano Roll, press S to toggle slide mode. Slides work with FL's own instruments, not third-party plugins.",cfg:{mode:"glide",voice:"808",bpm:140,bars:1,cell:1,low:36,high:48,len:1,par:5,target:[{m:36,s:0,l:8},{m:39,s:5,l:3,slide:!0},{m:36,s:10,l:6}]}},{id:"w2-5",engine:"keydrill",title:"Tool keys",short:"Tools",xp:40,brief:"Speed matters in the Piano Roll. Learn the tool keys so your hands never leave the keyboard.",lesson:"P draw, B paint, D delete, C slice, E select, S slide. Alt+V shows ghost notes from other channels, and Alt+S opens Strum.",tip:"Single-key tools only work while Typing keyboard to piano (Ctrl+T) is off.",cfg:{mode:"keys",pool:["draw","paint","del","slice","select","slide","ghost","strum"],rounds:10,show:"delay",par:[25,45]}},{id:"w2-6",engine:"flquest",title:"Minor mood in FL",short:"FL tune",xp:100,brief:"Write your own C minor melody in FL's Piano Roll: at least 6 notes, starting and ending on C.",lesson:"The Piano Roll check script reads the notes in the Piano Roll you have open and shows a claim code for every Piano Roll quest you've passed.",tip:"Open a channel's Piano Roll with F7, or right-click its button in the Channel Rack and choose Piano roll.",cfg:{tag:"lq05",steps:["Install the Piano Roll check script from the FL setup page.","Open a channel's Piano Roll (F7) and write the melody.","In the Piano Roll, run Tools \u203A Script list \u203A Loop Quest Check and copy the LQ05 claim code."]}},{id:"w2-7",engine:"flquest",title:"Rico's chords in FL",short:"FL chords",xp:100,brief:"Now my chords, for real: C minor, A\u266D, E\u266D, B\u266D, one per bar, in your Piano Roll.",lesson:"Put each chord's notes at the start of its bar and hold them for the whole bar.",tip:"FL's Stamp tool can place chords for you, but draw them by hand once so you learn the shapes.",cfg:{tag:"lq06",steps:["Open a keys channel's Piano Roll (F7).","Draw the four chords, one per bar.","In the Piano Roll, run Tools \u203A Script list \u203A Loop Quest Check and copy the LQ06 claim code."]}},{id:"w2-boss",engine:"flquest",boss:!0,title:"Rico's 808",short:"Boss",xp:250,brief:"Last one: my 808 line in your own FL. Long C, slide to D#, C again on step 11. Send me the code.",lesson:"Slides need one of FL's own instruments. Put an 808 sample in a Sampler channel, or use 3x Osc.",tip:"Slide notes show a small triangle in FL's Piano Roll, so you can spot them at a glance.",cfg:{tag:"lq07",steps:["Load an 808 into a Sampler channel, or use 3x Osc.","Open its Piano Roll (F7), press S for slide mode and write the line.","In the Piano Roll, run Tools \u203A Script list \u203A Loop Quest Check and copy the LQ07 claim code."]}}]},{id:"w3",num:3,name:"Playlist",client:"lumi",rank:"Arranger",icon:"layers",blurb:"Turn loops into songs: patterns, sections, markers and Song mode. Clearing this world opens the genre paths and the Vocals path.",quests:[{id:"w3-1",engine:"earquiz",title:"Pattern or Song?",short:"Modes",xp:50,brief:"Before we arrange anything, make sure you know how FL plays things back.",lesson:"Pattern mode loops the pattern you're working on. Song mode plays everything you've arranged in the Playlist.",tip:"Watch the PAT/SONG switch next to the transport buttons. It shows which mode you're in.",cfg:{set:"text",pass:6,questions:[{q:"Which mode plays your arrangement from the Playlist?",options:["Song mode","Pattern mode"],answer:0},{q:"Which key switches between Pattern and Song mode?",options:["L","S","P","M"],answer:0},{q:"Where do you arrange patterns into a song?",options:["Playlist","Mixer","Browser","Channel Rack"],answer:0},{q:"What does F4 do?",options:["Jumps to the next empty pattern","Opens the Mixer","Exports the song","Adds a marker"],answer:0},{q:"How do you rename the selected pattern?",options:["F2","F9","Ctrl+R","Alt+T"],answer:0},{q:"In Pattern mode, what does Space play?",options:["The current pattern, on loop","The whole Playlist","Only the selected clip"],answer:0},{q:"What adds a time marker in the Playlist?",options:["Alt+T","Ctrl+M","F6","L"],answer:0},{q:"What does Ctrl+B do to a Playlist selection?",options:["Duplicates it to the right","Deletes it","Mutes it","Bounces it to audio"],answer:0}]}},{id:"w3-2",engine:"arrange",title:"Drop Architect",short:"Drops",xp:60,brief:"Map my festival track: an intro, a build into the first drop, a break, another build and drop, then the outro.",lesson:"Sections are how a song breathes. Energy climbs in a build, peaks at the drop and rests in the break.",tip:"In FL, each section is patterns placed in the Playlist. Label them with markers (Alt+T) so you can find them.",cfg:{style:"edm",bpm:128,palette:["Intro","Build","Drop","Break","Outro"],target:["Intro","Build","Drop","Break","Build","Drop","Outro"]}},{id:"w3-3",engine:"arrange",title:"Song Map",short:"Map",xp:60,client:"grit",brief:"Map my song: intro, verse, hook, verse, hook, a bridge, the last hook, then the outro.",lesson:"Rap songs trade verses and hooks. The hook is the loudest, most repeated part; the bridge changes things up before the last hook.",tip:"In FL, every clip of the same pattern plays the same notes, so fixing one hook fixes them all.",cfg:{style:"rap",bpm:90,palette:["Intro","Verse","Hook","Bridge","Outro"],target:["Intro","Verse","Hook","Verse","Hook","Bridge","Hook","Outro"]}},{id:"w3-4",engine:"keydrill",title:"Playlist keys",short:"Keys",xp:40,brief:"Arranging is a lot of clicking unless you know the keys. Learn these.",lesson:"L switches modes, F4 jumps to the next empty pattern (and asks for a name), F2 renames a pattern and Alt+T drops a marker. In the Playlist, B paints clips, C slices them and T mutes them.",tip:"Hold Alt while dragging clips in FL to move them without snapping to the grid.",cfg:{mode:"keys",pool:["mode","play","newpat","renamepat","marker","paint","slice","mute"],rounds:10,show:"delay",par:[25,45]}},{id:"w3-auto",engine:"automation",title:"Automation Ears",short:"Curves",xp:50,brief:"Builds and drops are full of knobs that move by themselves. Listen to each clip and pick the curve that's moving the knob.",lesson:"An automation clip turns a knob for you as the song plays. Up means more: a higher cutoff sounds brighter, a higher volume sounds louder. A rising filter builds energy; a falling one pulls it back.",tip:"In FL, right-click almost any knob and choose Create automation clip. The clip lands in the Playlist, ready to edit. For third-party plugins, move the knob, then use Tools \u203A Last tweaked \u203A Create automation clip.",cfg:{mode:"name",count:6,pass:4}},{id:"w3-draw",engine:"automation",title:"Draw the Sweep",short:"Sweep",xp:60,brief:"Your turn to draw one. Play my filter sweep, then paint an automation curve so yours sounds the same.",lesson:"Drag across the clip to draw. Higher is brighter, lower is darker. Match the shape bar by bar: where it starts, when it moves, and where it ends up.",tip:"In an FL automation clip, right-click to add a point, drag a point to move it, and drag the small tension handle between two points up or down to bend the curve.",cfg:{mode:"draw",param:"cutoff",curves:["rise","fall","dip","swell","steps","cut"]}},{id:"w3-5",engine:"flquest",title:"Mark it up",short:"Markers",xp:100,brief:"Label a song in your FL Playlist: add Intro, Verse and Hook markers, switch to Song mode and play.",lesson:"Time markers sit above the Playlist timeline and name the parts of your song.",tip:"Right-click a marker in FL to rename it.",cfg:{tag:"lq08",steps:["Rename your pattern LQ08 (F2).","In the Playlist, add markers with Alt+T and name them Intro, Verse and Hook.","Switch to Song mode (L) and press Space."]}},{id:"w3-boss",engine:"flquest",boss:!0,title:"One-minute song",short:"Boss",xp:250,brief:"Now arrange a real minute: at least 32 bars in your Playlist, with Intro, Drop and Outro markers. Play it for me.",lesson:"The script reads your song's length in bars and its marker names. Any patterns count, even ones from earlier quests.",tip:"Paint the same pattern across bars with B, then vary it. Arrangement is repetition plus change.",cfg:{tag:"lq09",steps:["Rename a pattern LQ09.","Arrange at least 32 bars in the Playlist, with Intro, Drop and Outro markers.","Switch to Song mode (L) and press Space."]}}]},{id:"w4",num:4,name:"Sound Design",client:"wraith",rank:"Producer",icon:"wave",blurb:"Hear what synth controls do: waveforms, filters, envelopes and LFOs. Then load real synths in FL.",quests:[{id:"w4-1",engine:"earquiz",title:"Waveform ID",short:"Waves",xp:50,brief:"Every synth sound starts as a waveform. Learn to hear the four basic shapes.",lesson:"Sine is pure and round. Triangle is soft with a little edge. Square is hollow, like an old video game. Saw is bright and buzzy.",tip:"FL's 3x Osc lets you pick a shape for each of its three oscillators.",cfg:{set:"waveform",count:8,pass:6}},{id:"w4-2",engine:"soundmatch",title:"Filter Sweep",short:"Filter",xp:60,brief:"Same saw, different brightness. Set the filter cutoff so yours matches mine.",lesson:"A low-pass filter cuts the highs. A lower cutoff sounds darker and muffled; a higher one sounds brighter.",tip:"In FL, Fruity Filter is a simple filter you can put on any mixer track. Fruity Love Philter does the same job with far more options.",cfg:{params:["cutoff"],fixed:{wave:"sawtooth",decay:.5,lfo:"off"}}},{id:"w4-3",engine:"soundmatch",title:"Envelope Shaper",short:"Envelope",xp:60,brief:"Now length and shape. Short plucks and long notes come from the envelope.",lesson:"The envelope decides how a sound fades. A short decay makes a pluck; a long one makes a held note.",tip:"In FL, click a channel's button to open its settings, where the envelope controls live.",cfg:{params:["wave","decay"],fixed:{cutoff:2e3,lfo:"off"}}},{id:"w4-4",engine:"soundmatch",title:"Sound Match",short:"Match",xp:80,brief:"Full recreation: shape, filter and envelope. Match my bass by ear.",lesson:"Go one control at a time: shape first, then brightness, then length.",tip:"In FL, save a sound you like as a preset from the plugin's menu so you can reuse it.",cfg:{params:["wave","cutoff","decay"],fixed:{lfo:"off"}}},{id:"w4-5",engine:"flquest",title:"Load a synth in FL",short:"FL synth",xp:100,brief:"Set up a bass synth in your FL: a channel named Bass running 3x Osc or FLEX.",lesson:"Samples play recordings; synths generate sound. The script checks that your Bass channel runs a synth plugin.",tip:"Add a synth with the + button at the bottom of FL's Channel Rack. Rename a channel by right-clicking its button.",cfg:{tag:"lq16",steps:["Rename your pattern LQ16.","Add 3x Osc or FLEX to the Channel Rack and rename the channel Bass.","Press Space."]}},{id:"w4-boss",engine:"flquest",boss:!0,title:"Bass and lead",short:"Boss",xp:250,brief:"Give me two synth channels: a Bass and a Lead, each with its own synth. Then play.",lesson:"Different jobs, different synths. Use a round sound for the bass and something brighter for the lead.",tip:"Try a saw in 3x Osc for the lead and a sine or FLEX bass preset for the bass.",cfg:{tag:"lq17",steps:["Rename your pattern LQ17.","Make a Bass channel and a Lead channel, each with a synth plugin.","Press Space."]}}]},{id:"w5",num:5,name:"Mixer",client:"sol",rank:"Engineer",icon:"sliders",blurb:"Routing, EQ, sends and sidechain. Hear what each move does, then mix in FL without clipping.",quests:[{id:"w5-map",engine:"hotspot",title:"Mixer Anatomy",short:"Mixer",xp:40,brief:"A mixer looks scary until you know one strip. Learn one, and you know them all.",lesson:"Every track has a mute light, a pan knob, a name, a peak meter and a fader. The selected track's effects stack in the slots on the right, and everything flows into the Master.",tip:"In FL, click a mixer track to select it; its effect slots show on the right.",cfg:{scene:"mixer"}},{id:"w5-1",engine:"routing",title:"Signal Flow",short:"Routing",xp:60,brief:"A clean mix starts with clean routing. Give each drum and the bass its own mixer track.",lesson:"Every channel sends its sound to a mixer track. Separate tracks let you EQ and level each sound on its own.",tip:"In FL's Channel Rack, select a channel and press Ctrl+L to route it to a free mixer track.",cfg:{level:1}},{id:"w5-lvl",engine:"mixmatch",title:"Fader Balance",short:"Levels",xp:60,brief:"My rough mix is all over the place. Play the target, then set the faders so yours sounds the same. The kick is your anchor.",lesson:"Balance is the first job in any mix: how loud each sound is next to the others. Build it around the kick. When something is too loud, pull its fader down instead of pushing everything else up.",tip:"In FL's Mixer, select a track and press S to solo it, or right-click its mute switch (the green light). Solo to find a sound, then judge its level with everything playing.",cfg:{mode:"level",style:"house",changes:2}},{id:"w5-2",engine:"earquiz",title:"Mix Doctor",short:"EQ",xp:60,brief:"Something's boosted in each clip. Find which frequency is sticking out.",lesson:"Around 100 Hz is weight, 400 Hz is mud, 1.5 kHz is presence, 5 kHz is bite and 10 kHz is air.",tip:"FL's Fruity Parametric EQ 2 shows a live spectrum, so you can see what you hear.",cfg:{set:"eq",count:8,pass:5}},{id:"w5-eq",engine:"eq",title:"EQ Surgeon",short:"Cut",xp:70,brief:"Three tracks, three problems: rumble under the piano, mud in the loop and a ringing snare. Find each one on the EQ, fix it, then check.",lesson:"Cut before you boost. A low cut (high-pass) clears rumble from anything that isn't the kick or the bass. A wide, gentle cut between 200 and 500 Hz clears mud. A ring needs a narrow, deep cut: boost a thin band, sweep until the ring jumps out, then pull it down.",tip:"This EQ works like Fruity Parametric EQ 2: drag a band's dot to move it and scroll over the dot to change its width. In FL, right-click a dot to change its type, such as High Pass for a low cut.",cfg:{rounds:["lowcut","mud","ring"]}},{id:"w5-pan",engine:"mixmatch",title:"Stereo Field",short:"Pan",xp:60,brief:"Headphones on for this one. Pan each sound left or right to match the target. The kick and the 808 stay in the middle.",lesson:"The pan knob moves a sound between the left and right speakers. Keep the kick, bass and lead vocal centered so the low end hits on every system. Spread hats, percussion and extra layers to the sides, and balance them: if one goes left, send another right.",tip:"Every FL mixer track has a pan knob above its fader. Channels in the Channel Rack have their own pan knob too.",cfg:{mode:"pan",style:"trap",changes:2}},{id:"w5-3",engine:"sidechain",title:"Pump It",short:"Pump",xp:60,brief:"The bass is fighting the kick. Make it duck on every kick, and match my pump.",lesson:"Sidechain compression turns the bass down each time the kick hits, then lets it back up. Depth is how far it ducks; release is how fast it recovers.",tip:"In FL, send the Kick's mixer track to the Bass track with \u201CSidechain to this track\u201D, then point Fruity Limiter's compressor on the Bass at it. Newer versions call the option \u201CSidechain only to this track\u201D.",cfg:{style:"house",bpm:124}},{id:"w5-4",engine:"routing",title:"Signal Flow II",short:"Sends",xp:60,brief:"Now the pro moves: send the Snare and the Lead to a reverb bus, and sidechain the Kick into the Bass.",lesson:"A send shares one reverb between several tracks. A sidechain route doesn't play the kick through the bass; it only tells the bass's compressor when to duck.",tip:"In FL, select the source track, then right-click the small arrow under the target track for routing options, including sidechain.",cfg:{level:2}},{id:"w5-5",engine:"flquest",title:"Route the drums in FL",short:"FL route",xp:100,brief:"In your FL: Kick, Clap and Hat each on their own mixer track, and each track named after its sound.",lesson:"The script checks which mixer track each channel feeds, and the track names.",tip:"Select a mixer track and press F2 to rename it.",cfg:{tag:"lq18",steps:["Start a new project and rename the pattern LQ18.","In the Channel Rack, route Kick, Clap and Hat to their own mixer tracks (select a channel, Ctrl+L).","In the Mixer, name each track after its channel: select it and press F2."]}},{id:"w5-bal",engine:"flquest",title:"Pan and balance in FL",short:"FL mix",xp:100,brief:"In your FL: keep the kick and clap in the middle, spread the hat and snare to opposite sides, and tuck the hat under the kick.",lesson:"The script reads each drum's mixer track: its pan knob and its fader. Kick and clap stay centered. Hat and snare go at least 20% to opposite sides, and the hat's fader sits at least 3 dB below the kick's.",tip:"Headphones make panning easy to hear. Solo a track (select it and press S) to hear where it sits on its own.",cfg:{tag:"lq21",steps:["Start a new project and rename the pattern LQ21.","Route Kick, Clap, Hat and Snare to their own mixer tracks: select each channel and press Ctrl+L.","In the Mixer, pan the Hat and Snare tracks at least 20% to opposite sides, keep Kick and Clap centered, and pull the Hat's fader at least 3 dB under the Kick's.","Press Space."]}},{id:"w5-boss",engine:"flquest",boss:!0,title:"Clean mix",short:"Boss",xp:250,brief:"Final mix check: an EQ on the kick's track, a limiter on the master, then 8 bars without clipping.",lesson:"The script watches the master's peak level while you play. Go over 0 dB and the count starts again.",tip:"Mix quieter than you think. Leave the master peaking a few dB below 0.",cfg:{tag:"lq19",steps:["Rename your pattern LQ19 and route the Kick to its own mixer track.","Add Fruity Parametric EQ 2 to the Kick's track. Make sure the Master has a limiter, such as Fruity Limiter, in its last slot.","Press Space and let it play 8 bars without clipping."]}}]},{id:"w6",num:6,name:"Finish and Ship",client:"kade",rank:"Headliner",icon:"trophy",blurb:"No clipping, clean exports, and a finished track checked by the label. Clear this and you're a Headliner.",quests:[{id:"w6-1",engine:"earquiz",title:"Clip or clean?",short:"Clip",xp:50,brief:"Nothing leaves this label clipping. Train your ear to hear it.",lesson:"Clipping happens when a signal goes past 0 dB and its peaks get chopped off. It sounds crunchy and harsh, especially on kicks and bass.",tip:"Watch FL's master meter while you play the loudest part of your song.",cfg:{set:"clip",count:8,pass:6}},{id:"w6-mc",engine:"fxchain",title:"Master chain",short:"Master",xp:60,brief:"Before anything ships, the master bus gets a final check. Put the master plugins in order, and leave out what doesn't belong.",lesson:"On the master, tone and glue come first and the limiter always comes last, so nothing after it can push the level back over 0 dB. Reverb rarely belongs on the master: it muddies the whole mix.",tip:"If your Master already has Fruity Limiter, keep it in the last slot you use.",cfg:{track:"Master",slots:3,items:[{id:"eq",name:"EQ",does:"Shapes the overall tone",why:"Fix the tone first, so the compressor and limiter work on a balanced mix."},{id:"comp",name:"Compressor",does:"Glues the mix together",why:"Gentle compression glues the mix before the final level is set."},{id:"limiter",name:"Limiter",does:"Sets the final level and stops clipping",why:"The limiter always goes last: nothing after it can push the level back over 0 dB."},{id:"reverb",name:"Reverb",does:"Adds space",why:"Reverb on the master washes out the whole mix. Put it on sends for single tracks."}],orders:[["eq","comp","limiter"],["comp","eq","limiter"]],success:"Tone, glue, then the limiter last. The master is ready."}},{id:"w6-2",engine:"earquiz",title:"Save and export",short:"Export",xp:50,brief:"Know your save and export keys before a session crashes on you.",lesson:"Save often, and save new versions (Ctrl+N) before big changes so you can go back. Ctrl+Z undoes your last edit; press it again and the edit comes back. Ctrl+Alt+Z steps back further.",tip:"Some of these keys do other things in a web browser, so this one is a quiz, not a key drill.",cfg:{set:"text",pass:6,questions:[{q:"Which keys export a WAV file?",options:["Ctrl+R","Ctrl+Shift+R","Ctrl+E","Ctrl+W"],answer:0},{q:"Which keys export an MP3?",options:["Ctrl+Shift+R","Ctrl+R","Ctrl+M","Ctrl+Shift+S"],answer:0},{q:"Which keys export a MIDI file?",options:["Ctrl+Shift+M","Ctrl+M","Ctrl+Shift+R","Alt+M"],answer:0},{q:"Which keys save a new version of your project?",options:["Ctrl+N","Ctrl+S","Ctrl+Shift+N","Alt+S"],answer:0},{q:"Which keys open Save As?",options:["Ctrl+Shift+S","Ctrl+S","Ctrl+A","Ctrl+Shift+A"],answer:0},{q:"Which keys undo your last edit?",options:["Ctrl+Z","Ctrl+U","Ctrl+Y","Alt+Z"],answer:0},{q:"Which format keeps full quality for masters?",options:["WAV","MP3"],answer:0},{q:"Where should the master meter peak on your loudest part?",options:["Just below 0 dB","Into the red","Around \u221240 dB"],answer:0}]}},{id:"w6-3",engine:"flquest",title:"No Clip Zone",short:"No clip",xp:100,brief:"Play your song in FL for 16 bars without the master clipping.",lesson:"The script counts bars of clean playback in Song mode. A single clip restarts the count.",tip:"If it clips, turn down the loudest track, not just the master.",cfg:{tag:"lq20",steps:["Rename your pattern LQ20.","Switch to Song mode (L) and play your song.","Play 16 bars without the master clipping."]}},{id:"w6-4",engine:"exportcheck",title:"Export Check",short:"Check",xp:100,brief:"Send me an export. Any beat you've made, 30 seconds or longer, as a WAV or MP3.",lesson:"The check runs in your browser: length, peak level and loudness. Your file never leaves your computer.",tip:"In FL, switch to Song mode (L) first, then press Ctrl+R for a WAV or Ctrl+Shift+R for an MP3. Check the export window is set to the full song.",cfg:{minSeconds:30,rms:[-24,-6]}},{id:"w6-boss",engine:"exportcheck",boss:!0,title:"Ship It",short:"Boss",xp:300,brief:"This is the one: a finished track, two minutes or longer, no clipping, and loud enough to stand next to other releases.",lesson:"Loudness is measured as average (RMS) level. Between \u221218 and \u22126 dB passes, and the peaks mustn't clip.",tip:"Set the master limiter's ceiling to about \u22121 dB. Too quiet? Push more level into it. Clipping? Lower the tracks feeding the master.",cfg:{minSeconds:120,rms:[-18,-6]}}]}],Ke=[{id:"gh",name:"House",client:"nova",tempo:"120\u2013126 BPM",icon:"grid",blurb:"Four on the floor, open hats and a bass that ducks for the kick.",quests:[{id:"gh-1",engine:"rackrace",title:"Open hats",short:"Hats",xp:50,brief:"Deep house breathes. Open hats on the offbeats, and two little snare pickups on 8 and 16.",lesson:"An open hat rings longer than a closed one, so the offbeat floats. Pickups lead into the next beat.",tip:"In FL, drag a different hat sample from the Browser (Alt+F8) onto the Hat channel to swap its sound.",cfg:{bpm:122,rows:["Kick","Clap","Hat","Snare"],voices:{Hat:"Open hat"},prefill:{Kick:He.Kick,Clap:He.Clap},locked:["Kick","Clap"],target:{Kick:He.Kick,Clap:He.Clap,Hat:[3,7,11,15],Snare:[8,16]},par:[25,55]}},{id:"gh-2",engine:"earquiz",title:"Which one pumps?",short:"Pump",xp:50,brief:"Half of house is the pump. I'll play two loops. Tell me which one is sidechained.",lesson:"Listen to the chords between kicks. If they swell back up after every kick, they're sidechained.",tip:"FL's Fruity Limiter has a compressor mode that does sidechain ducking.",cfg:{set:"pump",count:8,pass:6}},{id:"gh-3",engine:"flquest",title:"Deep house in FL",short:"FL",xp:150,brief:"Build my deep house groove in your FL at {tempo} BPM: kick, clap, open hats and snare pickups.",lesson:"Same idea as World 1, plus the Snare row. The script checks all four rows and the tempo.",tip:"The default project's Snare channel works for the pickups.",cfg:{tag:"lq13",steps:["Start a new project and rename the pattern LQ13.","Program Kick, Clap, Hat and Snare as shown, at {tempo} BPM.","Press Space and copy the claim code."]}},{id:"gh-auto",engine:"automation",title:"Filter Build",short:"Build",xp:60,brief:"Every house build needs a filter that opens up into the drop. Listen to my build, then draw the cutoff automation so yours matches.",lesson:"A low-pass filter that opens over the build makes the track brighter bar by bar, so the drop lands harder. Some builds open steadily, some wait for the last bar, and some climb a step each bar.",tip:"In FL, right-click a plugin's cutoff knob and choose Create automation clip, then shape the clip in the Playlist.",cfg:{mode:"draw",param:"cutoff",curves:["rise","late","steps"]}}]},{id:"gb",name:"Boom bap",client:"grit",tempo:"86\u201394 BPM",icon:"grid",blurb:"Dusty drums, swing, and snares that crack on 2 and 4.",quests:[{id:"gb-1",engine:"rackrace",title:"Lazy swing",short:"Swing",xp:50,brief:"Boom bap lives on swing. Kick on 1, 8 and 11, snare on 2 and 4, hats on every 8th note, and let it lean.",lesson:"Swing delays every second 16th note, so the groove limps in a good way. The swing is already set; your job is the pattern.",tip:"FL's Channel Rack has a swing knob at the top. Turn it up and straight beats start to bounce.",cfg:{bpm:90,swing:.55,rows:["Kick","Snare","Hat"],target:{Kick:[1,8,11],Snare:[5,13],Hat:Xt},par:[35,70]}},{id:"gb-2",engine:"earquiz",title:"Swing or straight?",short:"Ears",xp:50,brief:"Train your ear. I'll play the same beat twice. Tell me which one swings.",lesson:"Listen to the hats. Swung hats go long-short, long-short. Straight hats are even.",tip:"Try FL's swing knob on any beat to hear the same thing.",cfg:{set:"swing",count:8,pass:6}},{id:"gb-3",engine:"flquest",title:"Boom bap in FL",short:"FL",xp:150,brief:"My groove in your FL at {tempo} BPM. Kick, snare and 8th-note hats.",lesson:"The script checks the pattern and tempo. Swing is up to you; it won't affect the check.",tip:"Use the Snare channel from the default project.",cfg:{tag:"lq10",steps:["Start a new project and rename the pattern LQ10.","Program Kick, Snare and Hat as shown, at {tempo} BPM.","Press Space and copy the claim code."]}},{id:"gb-chop",engine:"chop",title:"Chop the Sample",short:"Chop",xp:60,brief:"I dug up some dusty keys. Chop the sample: one slice where each chord starts, so every chord gets its own pad.",lesson:"Chopping cuts a sample into pieces at its hits (transients), the sharp starts you can see in the waveform. Slice right on a hit and each chop starts clean. Slice in the middle of a chord and the chop starts halfway through a sound.",tip:"In FL, drag a sample from the Browser onto Slicex. It finds the hits and slices the sample for you, and you play the slices from the Piano Roll.",cfg:{mode:"chop"}},{id:"gb-flip",engine:"chop",title:"Flip It",short:"Flip",xp:70,brief:"Now flip those chops into something new. Listen to my flip, then put the chops on the 8th notes so yours sounds the same.",lesson:"A flip rearranges chops into a new melody over your drums. Each new chop cuts off the one before, so an empty slot lets the last chop ring. Audition the pads until you know which one is which.",tip:"In FL, Slicex plays each slice from its own key, so you can write a flip in the Piano Roll. You can also drop single chops onto FPC pads.",cfg:{mode:"flip"}}]},{id:"gt",name:"Trap",client:"rico",tempo:"136\u2013146 BPM",icon:"grid",blurb:"Half-time claps, rolling hats and 808s that slide.",quests:[{id:"gt-1",engine:"rackrace",title:"Hat rolls",short:"Rolls",xp:50,brief:"Trap hats talk. 8th notes all bar, then roll the last beat in 32nds.",lesson:"This grid has 32 steps, so each step is a 32nd note. Every 4 steps is an 8th note, and filling all 4 steps of a beat makes a roll.",tip:"In FL, draw rolls in the Piano Roll with a finer snap, like 1/2 step or 1/4 step.",cfg:{bpm:140,steps:32,rows:["Kick","Clap","Hat"],prefill:{Kick:[1,13,21],Clap:[17]},locked:["Kick","Clap"],target:{Kick:[1,13,21],Clap:[17],Hat:[1,5,9,13,17,21,25,29,30,31,32]},par:[30,60]}},{id:"gt-2",engine:"pianoroll",title:"808 Glide Golf II",short:"808",xp:60,brief:"Another 808: a long C that slides up to G, then D# on beat 3 and C on beat 4.",lesson:"Turn slide mode on for the slide note only, then back off. Every mode switch counts as a move.",tip:"Keep 808 notes long enough to overlap the slide, or there's nothing to bend.",cfg:{mode:"glide",voice:"808",bpm:140,bars:1,cell:1,low:36,high:48,len:1,par:6,target:[{m:36,s:0,l:7},{m:43,s:5,l:2,slide:!0},{m:39,s:8,l:4},{m:36,s:12,l:4}]}},{id:"gt-3",engine:"flquest",title:"Trap groove in FL",short:"FL",xp:150,brief:"Build my trap drums in your FL at {tempo} BPM: kick bounce, clap on 3, 8th-note hats.",lesson:"At 140 BPM with the clap on beat 3, the beat feels half as fast. That's half-time.",tip:"Add hat rolls afterwards in the Piano Roll; the check only reads the Channel Rack steps.",cfg:{tag:"lq11",steps:["Start a new project and rename the pattern LQ11.","Program Kick, Clap and Hat as shown, at {tempo} BPM.","Press Space and copy the claim code."]}},{id:"gt-mix",engine:"mixmatch",title:"808 vs Kick",short:"Mix",xp:60,brief:"My 808 keeps swallowing the kick. Balance the drums and the 808 against my reference. The kick is your anchor.",lesson:"In trap the kick and the 808 share the low end. Set the kick first, then bring the 808 up under it until both hit. If the kick disappears, pull the 808 down rather than pushing the kick up.",tip:"In FL, give the kick and the 808 their own mixer tracks (select a channel, then Ctrl+L) so each gets its own fader.",cfg:{mode:"level",style:"trap",changes:2}}]},{id:"gd",name:"Drill",client:"tess",tempo:"140\u2013144 BPM",icon:"grid",blurb:"Sparse kicks, late snares and hats in 3-3-2.",quests:[{id:"gd-1",engine:"rackrace",title:"3-3-2 hats",short:"Hats",xp:50,brief:"Drill hats skip. Hit them in 3-3-2 twice: 1, 4, 7, then 9, 12, 15. Snare on 9 with a late one on 12, kick on 1 and 11.",lesson:"3-3-2 splits 8 steps into groups of 3, 3 and 2. That off-kilter grouping gives drill its bounce.",tip:"Drill drums are sparse on purpose; sliding 808s carry the rhythm. Treat this pattern as a starting point.",cfg:{bpm:142,rows:["Kick","Snare","Hat"],target:{Kick:[1,11],Snare:[9,12],Hat:[1,4,7,9,12,15]},par:[30,60]}},{id:"gd-2",engine:"flquest",title:"Drill groove in FL",short:"FL",xp:150,brief:"Now in your FL at {tempo} BPM. Kick, snare and 3-3-2 hats.",lesson:"The script checks each row and the tempo, and outlines the row to fix.",tip:"Once it passes, try sliding 808s underneath it in the Piano Roll.",cfg:{tag:"lq12",steps:["Start a new project and rename the pattern LQ12.","Program Kick, Snare and Hat as shown, at {tempo} BPM.","Press Space and copy the claim code."]}},{id:"gd-808",engine:"pianoroll",title:"Sliding 808s",short:"808",xp:60,brief:"Drill 808s never sit still. A long C that slides up to D#, then an A# that slides down to G, and A# again on beat 4. Fewest moves wins.",lesson:"Each slide note bends the 808 that's already playing to its own pitch. Turn Slide on only for the two slide notes, and make sure the note underneath is long enough to overlap them.",tip:"In FL's Piano Roll, press S to toggle slide mode. Drill 808s slide down as often as they slide up.",cfg:{mode:"glide",voice:"808",bpm:142,bars:1,cell:1,low:29,high:41,len:1,par:9,target:[{m:36,s:0,l:6},{m:39,s:3,l:3,slide:!0},{m:34,s:6,l:4},{m:31,s:8,l:2,slide:!0},{m:34,s:12,l:4}]}}]},{id:"gf",name:"Future bass",client:"lumi",tempo:"145\u2013155 BPM",icon:"grid",blurb:"Big supersaw chords that pump, over half-time drums.",quests:[{id:"gf-1",engine:"pianoroll",title:"Supersaw chords",short:"Chords",xp:60,brief:"Future bass chords, big and bright: F, G, E minor, A minor. One per bar.",lesson:"Major chords sound bright and minor chords darker. This move keeps lifting without landing home.",tip:"In FL, stack detuned saws (3x Osc's detune knobs, or a supersaw preset in FLEX) for this sound.",cfg:{mode:"chords",voice:"supersaw",bpm:150,bars:4,cell:4,low:55,high:79,len:4,chords:[{name:"F major",pcs:[5,9,0]},{name:"G major",pcs:[7,11,2]},{name:"E minor",pcs:[4,7,11]},{name:"A minor",pcs:[9,0,4]}]}},{id:"gf-2",engine:"sidechain",title:"Pump it harder",short:"Pump",xp:60,brief:"Future bass chords should pump hard. Match my sidechain.",lesson:"Deep, slow pumps make chords swell like they're breathing. Listen for how long the swell takes.",tip:"Plugins like Gross Beat (Signature edition) can fake a pump with a volume shape instead of a compressor.",cfg:{style:"futurebass",bpm:150}},{id:"gf-3",engine:"flquest",title:"Future bass drums in FL",short:"FL",xp:150,brief:"My half-time drums in your FL at {tempo} BPM: kick, clap on 3, offbeat hats.",lesson:"The script checks each row and the tempo.",tip:"Put your Supersaw chords on top once the drums pass.",cfg:{tag:"lq14",steps:["Start a new project and rename the pattern LQ14.","Program Kick, Clap and Hat as shown, at {tempo} BPM.","Press Space and copy the claim code."]}}]},{id:"gs",name:"Dubstep",client:"wraith",tempo:"138\u2013142 BPM",icon:"grid",blurb:"Half-time drums and a wobble bass driven by an LFO.",quests:[{id:"gs-1",engine:"soundmatch",title:"Wobble match",short:"Wobble",xp:60,brief:"Match my wobble. Same bass, different LFO speed. Is it wobbling every beat, every 8th or every 16th?",lesson:"An LFO moves a control up and down in time with the beat. On a filter it makes the bass go \u201Cwub\u201D. Faster rate, faster wubs.",tip:"In FL, try a tempo-synced LFO in Sytrus, or automate the cutoff of Fruity Love Philter.",cfg:{params:["lfo"],fixed:{wave:"sawtooth",cutoff:1e3,decay:1},bpm:140}},{id:"gs-2",engine:"rackrace",title:"Half-time",short:"Drums",xp:50,brief:"Dubstep is 140 but feels like 70. Snare on beat 3 only, kick on 1 and 12, hats on 8th notes.",lesson:"Half-time moves the snare from beats 2 and 4 to beat 3, so the groove feels twice as slow.",tip:"Big dubstep snares are often layered: two or three snare samples on the same steps.",cfg:{bpm:140,rows:["Kick","Snare","Hat"],target:{Kick:[1,12],Snare:[9],Hat:Xt},par:[25,55]}},{id:"gs-3",engine:"flquest",title:"Dubstep drums in FL",short:"FL",xp:150,brief:"Build my half-time drums in your FL at {tempo} BPM.",lesson:"The script checks each row and the tempo.",tip:"Add the wobble bass on its own channel once the drums pass.",cfg:{tag:"lq15",steps:["Start a new project and rename the pattern LQ15.","Program Kick, Snare and Hat as shown, at {tempo} BPM.","Press Space and copy the claim code."]}}]},{id:"gv",name:"Vocals",client:"grit",tempo:"Record \xB7 tune \xB7 mix",icon:"user",blurb:"Record your own verses in FL, then build a vocal chain that sounds finished.",quests:[{id:"gv-1",engine:"earquiz",title:"Booth basics",short:"Booth",xp:50,brief:"Before I spit a single bar, the session has to be ready. Show me you know how FL records.",lesson:"Pick the input on a mixer track, arm the track, turn recording on with R, then press Play. Recording audio inside FL needs FL Studio Producer Edition or higher.",tip:"Right-click FL's record button for the Recording filter: it decides whether audio, notes, automation or clips get recorded.",cfg:{set:"text",pass:6,questions:[{q:"Where do you choose the audio input for recording?",options:["The mixer track's Input menu","The Channel Rack's swing knob","Options \u203A MIDI settings","The Browser's Current project folder"],answer:0,explain:"Each mixer track has an Input menu for choosing what it records. Picking an input also arms the track."},{q:"What arms a mixer track for recording?",options:["Its recording arm switch (the disk icon)","Right-clicking its pan knob","Pressing F9 twice","Turning on the metronome"],answer:0,explain:"The track's recording arm switch turns red when the track is armed."},{q:"Which key turns recording on or off?",options:["R","Ctrl+R","Space","L"],answer:0,explain:"R switches recording on or off. Ctrl+R is export to WAV, a very different thing."},{q:"Recording is on and a track is armed. What starts the take?",options:["Pressing Play (Space)","Pressing R again","Saving the project","Opening Edison"],answer:0,explain:"With recording on, Play starts the take and Stop ends it."},{q:"Which shortcut turns the count-in before recording on or off?",options:["Ctrl+P","Ctrl+M","Ctrl+B","Ctrl+L"],answer:0,explain:"Ctrl+P toggles the recording count-in. Ctrl+M toggles the metronome itself."},{q:"On Windows, which audio driver gives the lowest latency?",options:["Your audio interface's own ASIO driver","FL Studio ASIO","Primary Sound Driver","They're all the same"],answer:0,explain:"Image-Line's manual ranks them: the interface's own ASIO driver, then ASIO4ALL, then FL Studio ASIO. Set it in Options \u203A Audio settings (F10)."},{q:"You record a verse in Song mode. Where does the take end up?",options:["As an audio clip in the Playlist","As notes in the Piano Roll","As an automation clip","Nowhere until you export"],answer:0,explain:"In Song mode, with Auto-create audio clips on, each take lands in the Playlist as an audio clip."},{q:"How do you record just bars 9 to 12 again?",options:["Ctrl+drag across those bars on the Playlist's bar ruler, turn on Loop record, then record","Mute every other bar","Export bars 9 to 12 first","Set the tempo to 9"],answer:0,explain:"Ctrl+drag across bars 9 to 12 on the Playlist's bar ruler and turn on Loop record. FL loops the selection, and each pass lands as an audio clip."}]}},{id:"gv-2",engine:"fxchain",title:"Vocal chain",short:"Chain",xp:60,brief:"My raw vocal sounds thin and harsh. Build the chain: plugins in the right slots, reverb where it belongs.",lesson:"Effects run top to bottom. A common starting chain is pitch correction, then EQ, then compression, then a de-esser. Reverb goes on a send track so several tracks can share it.",tip:"In FL's Mixer, load plugins into the vocal track's slots from the top. For reverb, select the vocal track, click the small arrow at the bottom of a spare track to send to it, and put the reverb there.",cfg:{track:"Vocals",sendName:"Reverb bus",slots:4,items:[{id:"pitch",name:"Pitch correction",does:"Pulls notes into tune",why:"Tune the raw vocal first, so every effect after it hears the corrected pitch."},{id:"eq",name:"EQ (high-pass)",does:"Cuts rumble and mud",why:"Clean up the low end before compressing, or the compressor reacts to rumble you can't hear."},{id:"comp",name:"Compressor",does:"Evens out loud and quiet words",why:"Compress once the vocal is clean, so it evens out the words, not the rumble."},{id:"deess",name:"De-esser",does:"Tames harsh S sounds",why:"De-essing next to the compressor catches the S sounds it brings up; either order works."},{id:"reverb",name:"Reverb",does:"Adds space",why:"On a send track, several tracks share one reverb and you choose how much each one gets."}],orders:[["pitch","eq","comp","deess"],["pitch","eq","deess","comp"]],send:["reverb"],success:"Pitch, EQ, compression and de-essing in the chain, reverb on a send. That's a solid starting point for any vocal."}},{id:"gv-3",engine:"flquest",title:"Ready to record in FL",short:"FL",xp:150,brief:"Set up your FL like we're about to track: an armed mixer track, recording on, and the transport rolling.",lesson:"The script checks that a mixer track is armed, recording is on and FL is playing. It doesn't need a microphone plugged in.",tip:"If recording doesn't start, check your FL Studio edition: recording audio needs Producer Edition or higher.",cfg:{tag:"lq22",steps:["Rename your pattern LQ22.","In the Mixer, pick an Input on a spare track, or click its recording arm switch (the disk icon).","Press R to turn recording on, then Space to start. Press Space again to stop."]}}]}],Ze=[{name:"Newcomer",boss:null},{name:"Rookie",boss:"w0-boss"},{name:"Loop maker",boss:"w1-boss"},{name:"Beatmaker",boss:"w2-boss"},{name:"Arranger",boss:"w3-boss"},{name:"Producer",boss:"w4-boss"},{name:"Engineer",boss:"w5-boss"},{name:"Headliner",boss:"w6-boss"}],kt=[{id:"first-loop",icon:"restart",name:"First Loop",desc:"Clear your first Rack Race."},{id:"space-cadet",icon:"space",name:"Space Cadet",desc:"Start playback with the Space bar, li STEPS = 16

    WID_MIXER: ("Mixer", "F9"),
    WID_CHANNEL_RACK: ("Channel Rack", "F6"),

    WID_BROWSER: ("Browser", "Alt+F8"),
}
TICKS_SLOW = 25        # OnIdle runs about every 20 ms: about twice a second
TICKS_FAST = 5         # about ten times a second for timed quests
FAST_KINDS = ("warp", "tour", "mixfx", "noclip")
REASSERT_SECONDS = 4.0 # show our hint again if FL replaced it
HINT_AFTER = 4.0       # seconds before a key hint appears in timed drills
HIGHLIGHT_MS = 30000
CLIP_LEVEL = 1.001     # 1.0 is 0 dBFS

CODE_ALPHABET = "0123456789ABCDEFGHJKMNPQRSTVWXYZ"  # Crockford base32


# ---------------------------------------------------------------- claim codes

def fnv1a32(text):
    """32-bit FNV-1a hash of a UTF-8 string. Mirrors fnv1a32() in the page."""
    h = 0x811C9DC5
    for byte in text.encode("utf-8"):
        h ^= byte
        h = (h * 0x01000193) & 0xFFFFFFFF
    return h


def mix32(h):
    """Scramble all 32 bits so nearby values give unrelated codes."""
    h ^= h >> 16
    h = (h * 0x85EBCA6B) & 0xFFFFFFFF
    h ^= h >> 13
    h = (h * 0xC2B2AE35) & 0xFFFFFFFF
    h ^= h >> 16
    return h


def claim_code(quest_id, variant):
    """Claim code for a finished quest. variant is the tempo, or 0."""
    h = mix32(fnv1a32("LQ1|%s|%d" % (quest_id, variant)))
    chars = []
    for _ in range(7):
        chars.append(CODE_ALPHABET[h & 31])
        h >>= 5
    body = "".join(chars)
    return "LQ-%s-%s" % (body[:3], body[3:])


# ---------------------------------------------------------------- session

class Session:
    def __init__(self):
        self.reset()

    def reset(self):
        self.ticks = 0
        self.clock = 0.0          # fallback clock when the time module is missing
        self.tag = None
        self.st = {}
        self.codes = {}           # tag -> (variant, code)
        self.message = ""
        self.shown_at = 0.0
        self.highlight_row = -1
        self.highlight_at = 0.0
        self.warned = False
        self.seed = 1234567


session = Session()


def now():
    if _time is not None:
        try:
            return _time.time()
        except Exception:
            pass
    return session.clock


def rand(n):
    """Small deterministic PRNG, so the script needs no random module."""
    session.seed = (session.seed * 1103515245 + 12345 + int(now() * 1000)) & 0x7FFFFFFF
    return session.seed % n


def result(done=False, msg="", variant=0, row=-1, ready=False):
    return {"done": done, "msg": msg, "variant": variant, "row": row, "ready": ready}


# ---------------------------------------------------------------- FL readers

def parse_tag(name):
    """Find a quest tag like LQ04 in a pattern name. Returns 'lq04' or None."""
    s = "".join(ch for ch in str(name).upper() if ch.isalnum())
    i = s.find("LQ")
    while i >= 0:
        digits = ""
        j = i + 2
        while j < len(s) and s[j].isdigit() and len(digits) < 2:
            digits += s[j]
            j += 1
        if digits:
            return "lq%02d" % int(digits)
        i = s.find("LQ", i + 1)
    return None


def read_tag():
    try:
        return parse_tag(patterns.getPatternName(patterns.patternNumber()))
    except Exception:
        return None


def find_channel(keyword):
    keyword = keyword.lower()
    for index in range(channels.channelCount()):
        if keyword in str(channels.getChannelName(index)).lower():
            return index
    return -1


def steps_on(index):
    return [pos + 1 for pos in range(STEPS) if channels.getGridBit(index, pos)]


def tempo():
    bpm = float(mixer.getCurrentTempo())
    if bpm > 1000:  # guard: some API versions report tempo x 1000
        bpm /= 1000.0
    return bpm


def focused_window():
    for index in WINDOWS:
        try:
            if ui.getFocused(index):
                return index
        except Exception:
            pass
    return -1


def rack_open():
    try:
        return bool(ui.getVisible(WID_CHANNEL_RACK) or ui.getFocused(WID_CHANNEL_RACK))
    except Exception:
        return True


def song_mode():
    return transport.getLoopMode() == 1


def marker_names():
    names = []
    if arrangement is None:
        return names
    for index in range(32):
        try:
            name = arrangement.getMarkerName(index)
        except Exception:
            break
        if name:
            names.append(str(name).lower())
    return names


def slot_plugins(track):
    names = []
    for slot in range(10):
        try:
            if plugins.isValid(track, slot):
                names.append(str(plugins.getPluginName(track, slot)).lower())
        except Exception:
            pass
    return names


def is_eq(name):
    words = "".join(ch if ch.isalnum() else " " for ch in name).split()
    return any(w.startswith("eq") for w in words) or "pro-q" in name or "pro q" in name


def is_limiter(name):
    return "limiter" in name or "maximus" in name or "clipper" in name


def master_peak():
    # getTrackPeaks: 0.0 silence, 1.0 = 0 dB, above 1.0 = clipping.
    try:
        return float(mixer.getTrackPeaks(0, 2))
    except Exception:
        pass
    peak = 0.0
    for side in (0, 1):
        try:
            peak = max(peak, float(mixer.getLastPeakVol(side)))
        except Exception:
            pass
    return peak


def words_list(items):
    items = list(items)
    if len(items) <= 1:
        return "".join(items)
    return ", ".join(items[:-1]) + " and " + items[-1]


def numbers(word, items):
    """'add step 9' or 'add steps 9, 13'."""
    return "%s%s %s" % (word, "s" if len(items) > 1 else "", ", ".join(str(i) for i in items))


def clean_play(st, bars):
    """Track how long playback has run without the master clipping.
    Returns 'stopped', 'clip', or a fraction of the target (1.0 = done)."""
    if not transport.isPlaying():
        st["clean"] = 0.0
        st["last"] = None
        return "stopped"
    t = now()
    if st.get("last") is not None:
        st["clean"] = st.get("clean", 0.0) + max(0.0, t - st["last"])
    st["last"] = t
    if master_peak() > CLIP_LEVEL:
        st["clean"] = 0.0
        st["clipped_at"] = t
        return "clip"
    need = bars * 4 * 60.0 / max(40.0, tempo())
    return min(1.0, st.get("clean", 0.0) / need)


def clean_message(state, bars):
    if state == "stopped":
        return "Press Space and let it play for %d bars" % bars
    if state == "clip":
        return "The master clipped! Turn down the loudest track or the master, then play on"
    return "Playing clean: %d of %d bars" % (int(state * bars), bars)


# ---------------------------------------------------------------- quest checks

def check_hello(q, st):
    if transport.isPlaying():
        return result(done=True)
    return result(msg="Quest found! Press Space to play", ready=True)


def check_warp(q, st):
    total = int(q.get("prompts", 6))
    if "i" not in st:
        st.update(i=0, target=None, prev=None, t_prompt=now(), t_start=None, elapsed=0.0)
    if st["i"] >= total:
        return result(done=True, msg="%d windows in %.1f s" % (total, st["elapsed"]))
    focused = focused_window()
    if st["target"] is None:
        options = [w for w in WINDOWS if w != focused and w != st["prev"]]
        st["target"] = options[rand(len(options))]
        st["t_prompt"] = now()
        if st["t_start"] is None:
            st["t_start"] = st["t_prompt"]
    if focused == st["target"]:
        st["i"] += 1
        st["prev"] = st["target"]
        st["target"] = None
        if st["i"] >= total:
            st["elapsed"] = now() - st["t_start"]
            return result(done=True, msg="%d windows in %.1f s" % (total, st["elapsed"]))
        return result(msg="Nice! %d of %d" % (st["i"], total))
    name, key = WINDOWS[st["target"]]
    hint = " (%s)" % key if now() - st["t_prompt"] > HINT_AFTER else ""
    return result(msg="%d/%d: open the %s%s" % (st["i"] + 1, total, name, hint))


TOUR_STEPS = (
    ("Turn on the metronome", "Ctrl+M", lambda: bool(ui.isMetronomeEnabled())),
    ("Switch to Song mode", "L", lambda: song_mode()),

    ("Open the Mixer", "F9", lambda: bool(ui.getFocused(WID_MIXER))),
    ("Open the Playlist", "F5", lambda: bool(ui.getFocused(WID_PLAYLIST))),
    ("Press play", "Space", lambda: bool(transport.isPlaying())),
)


def check_tour(q, st):
    if "i" not in st:
        st.update(i=0, t_step=now())
    total = len(TOUR_STEPS)
    while st["i"] < total and TOUR_STEPS[st["i"]][2]():
        st["i"] += 1
        st["t_step"] = now()
    if st["i"] >= total:
        return result(done=True)
    label, key, _ = TOUR_STEPS[st["i"]]
    hint = " (%s)" % key if now() - st["t_step"] > HINT_AFTER else ""
    return result(msg="Step %d/%d: %s%s" % (st["i"] + 1, total, label, hint))


def check_groove(q, st):
    if not rack_open():
        return result(msg="Press F6 to open the Channel Rack")
    for row in q["rows"]:
        index = find_channel(row["match"])
        if index < 0:
            return result(msg="No %s channel. Start a new project, or rename a channel %s"
                          % (row["label"], row["label"]))
        on = steps_on(index)
        missing = [s for s in row["steps"] if s not in on]
        extra = [s for s in on if s not in row["steps"]]
        if missing or extra:
            fixes = []
            if missing:
                fixes.append(numbers("add step", missing))
            if extra:
                fixes.append(numbers("remove step", extra))
            say = (" " + row["say"]) if row.get("say") else ""
            return result(msg="%s%s: %s" % (row["label"], say, "; ".join(fixes)), row=index)
    low, high = q["tempo"]
    bpm = tempo()
    whole = int(round(bpm))
    if abs(bpm - whole) > 0.05:
        return result(msg="Tempo is %.2f. Use a whole number, like %d" % (bpm, (low + high) // 2))
    if not low <= whole <= high:
        return result(msg="Now set the tempo from the brief (%d to %d BPM)" % (low, high))
    if transport.isPlaying():
        return result(done=True, variant=whole)
    return result(msg="Groove ready at %d BPM. Press Space to hear it" % whole, variant=whole, ready=True)


def check_pianoroll(q, st):
    return result(msg="Checked in the Piano Roll: open it (F7), then Tools > Script list > Loop Quest Check")


def check_markers(q, st):
    names = marker_names()
    missing = [n for n in q["names"] if not any(n.lower() in m for m in names)]
    if missing:
        return result(msg="Add Playlist markers (Alt+T) named %s. Missing: %s"
                      % (words_list(q["names"]), words_list(missing)))
    if not song_mode():
        return result(msg="Markers done. Switch to Song mode (L)")
    if transport.isPlaying():
        return result(done=True)
    return result(msg="Markers done. Press Space to play the song", ready=True)


def check_song(q, st):
    bars = 0
    try:
        bars = int(transport.getSongLength(3))
    except Exception:
        pass
    if bars < q["minBars"]:
        return result(msg="Song is %d bars. Arrange patterns in the Playlist to reach %d"
                      % (bars, q["minBars"]))
    names = marker_names()
    missing = [n for n in q["names"] if not any(n.lower() in m for m in names)]
    if missing:
        return result(msg="%d bars, nice. Add markers (Alt+T): %s" % (bars, words_list(missing)))
    if not song_mode():
        return result(msg="Switch to Song mode (L) so the Playlist plays")
    if transport.isPlaying():
        return result(done=True)
    return result(msg="Song ready at %d bars. Press Space" % bars, ready=True)


def check_synth(q, st):
    for name in q["channels"]:
        index = find_channel(name)
        if index < 0:
            return result(msg="Add a synth channel (3x Osc or FLEX) and rename it %s" % name)
        try:
            ok = plugins.isValid(index)
