        return result(done=True)
    return result(msg="%s ready. Press Space" % words_list(q["channels"]), ready=True)


def check_routing(q, st):
    used = {}
    tracks = []
    for name in q["channels"]:
        index = find_channel(name)
        if index < 0:
            return result(msg="No %s channel. Start a new project" % name)
        track = int(channels.getTargetFxTrack(index))
        if track <= 0:
            return result(msg="Route %s to its own mixer track: select it, press Ctrl+L" % name,
                          row=index)
        if track in used:
            return result(msg="%s and %s share insert %d. Give each its own track"
                          % (used[track], name, track), row=index)
        used[track] = name
        tracks.append((name, track))
    for name, track in tracks:
        if name.lower() not in str(mixer.getTrackName(track)).lower():
            return result(msg="Name insert %d \\"%s\\": select it in the Mixer, press F2" % (track, name))
    return result(done=True)


def check_mixfx(q, st):
    name = q.get("eqOn", "Kick")
    index = find_channel(name)
    if index < 0:
        return result(msg="No %s channel. Start a new project" % name)
    track = int(channels.getTargetFxTrack(index))
    if track <= 0:
        return result(msg="Route %s to its own mixer track first (Ctrl+L)" % name, row=index)
    if not any(is_eq(p) for p in slot_plugins(track)):
        return result(msg="Add Fruity Parametric EQ 2 to insert %d (%s)" % (track, name))
    if not any(is_limiter(p) for p in slot_plugins(0)):
        return result(msg="Add Fruity Limiter to the Master track")
    state = clean_play(st, q["bars"])
    if state == 1.0:
        return result(done=True)
    return result(msg=clean_message(state, q["bars"]))


def pan_text(pan):
    """-0.3 -> '30% left'."""
    amount = int(round(abs(pan) * 100))
    if amount == 0:
        return "centered"
    return "%d%% %s" % (amount, "left" if pan < 0 else "right")


def track_db(track):
    """A mixer track's fader in dB, or None on API versions without the dB mode
    (an error, or the mode flag ignored so the 0-1 fader position comes back)."""
    try:
        db = float(mixer.getTrackVolume(track, 1))
        if db == float(mixer.getTrackVolume(track)):
            return None
        return db
    except Exception:
        return None


def db_text(db):
    if db != db or db < -200:  # NaN or silence
        return "-inf dB"
    return "%+.1f dB" % db if abs(db) >= 0.05 else "0.0 dB"


def check_panmix(q, st):
    tracks = {}
    used = {}
    for name in q["center"] + q["sides"]:
        index = find_channel(name)
        if index < 0:
            return result(msg="No %s channel. Start a new project" % name)
        track = int(channels.getTargetFxTrack(index))
        if track <= 0:
            return result(msg="Route %s to its own mixer track: select it, press Ctrl+L" % name, row=index)
        if track in used:
            return result(msg="%s and %s share insert %d. Give each its own track"
                          % (used[track], name, track), row=index)
        used[track] = name
        tracks[name] = track
    # Compare whole percents and tenths of a dB, exactly as the hints show them.
    for name in q["center"]:
        pan = float(mixer.getTrackPan(tracks[name]))
        if int(round(abs(pan) * 100)) > int(round(q["centerMax"] * 100)):
            return result(msg="Keep the %s in the middle: its mixer track is panned %s"
                          % (name, pan_text(pan)))
    pans = dict((name, float(mixer.getTrackPan(tracks[name]))) for name in q["sides"])
    need = int(round(q["minPan"] * 100))
    for name in q["sides"]:
        if int(round(abs(pans[name]) * 100)) < need:
            return result(msg="Pan the %s's mixer track at least %d%% left or right (now %s)"
                          % (name, need, pan_text(pans[name])))
    first, second = q["sides"][0], q["sides"][1]
    if (pans[first] < 0) == (pans[second] < 0):
        return result(msg="Pan the %s and %s to opposite sides (both are %s)"
                      % (first, second, "left" if pans[first] < 0 else "right"))
    anchor = q["anchor"]
    anchor_db = track_db(tracks[anchor])
    for name in q["quieter"]:
        this_db = track_db(tracks[name])
        if anchor_db is None or this_db is None:
            # No decibels on this FL: compare the fader positions instead.
            if float(mixer.getTrackVolume(tracks[name])) >= float(mixer.getTrackVolume(tracks[anchor])) - 0.05:
                return result(msg="Pull the %s's fader down, below the %s's" % (name, anchor))
        elif round(this_db, 1) > round(anchor_db, 1) - q["belowDb"]:
            return result(msg="Pull the %s's fader down to at least %d dB under the %s's (%s %s, %s %s)"
                          % (name, q["belowDb"], anchor, anchor, db_text(anchor_db), name, db_text(this_db)))
    if not transport.isPlaying():
        return result(msg="Mix set: middle, sides and levels all check out. Press Space", ready=True)
    return result(done=True)


def armed_tracks():
    armed = []
    try:
        count = int(mixer.trackCount())
    except Exception:
        count = 127
    for track in range(1, count):
        try:
            if mixer.isTrackArmed(track):
                armed.append(track)
        except Exception:
            break
    return armed


def check_record(q, st):
    armed = armed_tracks()
    if not armed:
        return result(msg="Arm a mixer track: pick an Input for it, or click its recording arm switch (the disk icon)")
    if not transport.isRecording():
        return result(msg="Insert %d is armed. Press R to turn recording on" % armed[0])
    if not transport.isPlaying():
        return result(msg="Recording is on. Press Space to start the take", ready=True)
    return result(done=True)


def check_noclip(q, st):
    if not song_mode():
        st["clean"] = 0.0
        st["last"] = None
        return result(msg="Switch to Song mode (L) and play your song")
    state = clean_play(st, q["bars"])
    if state == 1.0:
        return result(done=True)
    return result(msg=clean_message(state, q["bars"]))


CHECKS = {
    "hello": check_hello,
    "warp": check_warp,
    "tour": check_tour,
    "groove": check_groove,
    "pianoroll": check_pianoroll,
    "markers": check_markers,
    "song": check_song,
    "synth": check_synth,
    "routing": check_routing,
    "mixfx": check_mixfx,
    "panmix": check_panmix,
    "record": check_record,
    "noclip": check_noclip,
}


# ---------------------------------------------------------------- diagnostics

def read_markers_check():
    if arrangement is None:
        return "not available in this FL version"
    names = marker_names()
    return "%d found%s" % (len(names), (": " + ", ".join(names[:6])) if names else "")


def diagnostics():
    """LQ00: report what the script can read, so problems are easy to spot."""
    lines = []
    values = {}

    def add(key, label, fn):
        try:
            value = fn()
        except Exception as error:
            value = None
            lines.append("  %s: can't read (%s)" % (label, error))
        else:
            lines.append("  %s: %s" % (label, value))
        values[key] = value

    add("fl", "FL Studio version", lambda: ui.getVersion())
    add("api", "Scripting API version", lambda: general.getVersion() if general is not None else "unknown")
    add("script", "Loop Quest script version", lambda: SCRIPT_VERSION)
    add("tempo", "Tempo", lambda: "%.1f BPM" % tempo())
    add("pattern", "Pattern", lambda: "%d, named %s" % (patterns.patternNumber(), patterns.getPatternName(patterns.patternNumber())))
    add("channels", "Channels", lambda: channels.channelCount())
    add("names", "Channel names", lambda: ", ".join(str(channels.getChannelName(i)) for i in range(min(12, channels.channelCount()))))
    add("mode", "Mode", lambda: "Song" if song_mode() else "Pattern")
    add("playing", "Playing", lambda: "yes" if transport.isPlaying() else "no")
    add("window", "Focused window", lambda: WINDOWS[focused_window()][0] if focused_window() in WINDOWS else "none of the five")
    add("peak", "Master peak (1.00 = 0 dB)", lambda: "%.2f" % master_peak())
    add("markers", "Playlist markers", read_markers_check)
    failed = sum(1 for line in lines if "can't read" in line)
    summary = "Loop Quest v%d is working. Scripting API %s, %s, %s channels" % (
        SCRIPT_VERSION, values.get("api") or "?", values.get("tempo") or "tempo unknown", values.get("channels") if values.get("channels") is not None else "?")
    if failed:
        summary += ". %d reading%s failed: see View > Script output" % (failed, "" if failed == 1 else "s")
    else:
        summary += ". Details in View > Script output"
    return summary, lines


# ---------------------------------------------------------------- main loop

def start_quest(tag):
    session.tag = tag
    session.st = {}
    print("Loop Quest: %s %s started" % (tag.upper(), QUESTS[tag]["title"]))


def check():
    tag = read_tag()
    if tag == "lq00":
        if session.tag != "lq00":
            session.tag = "lq00"
            session.st = {}
            summary, lines = diagnostics()
            session.st["summary"] = summary
            print("Loop Quest diagnostics (LQ00)\\n" + "\\n".join(lines))
        show(session.st.get("summary", "Loop Quest is working"))
        highlight(-1)
        return
    if session.tag == "lq00":  # left the diagnostics pattern
        session.tag = None
    if tag and tag != session.tag:
        if tag in QUESTS:
            start_quest(tag)
        else:
            show("Loop Quest: %s isn't a quest in this script (v%d). Check the tag, or download the latest script from the game's FL setup page"
                 % (tag.upper(), SCRIPT_VERSION))
            highlight(-1)
            return
    if session.tag is None:
        show("Loop Quest: select a pattern, press F2 and name it with your quest tag, like LQ01")
        highlight(-1)
        return

    q = QUESTS[session.tag]
    label = session.tag.upper()
    res = CHECKS[q["kind"]](q, session.st)
    variant = res["variant"] or 0

    if res["done"]:
        code = claim_code(session.tag, variant)
        if session.codes.get(session.tag) != (variant, code):
            session.codes[session.tag] = (variant, code)
            print("Loop Quest: %s complete%s. Claim code: %s"
                  % (label, (" at %d BPM" % variant) if variant else "", code))

    saved = session.codes.get(session.tag)
    if saved:
        if res["ready"] and variant and variant != saved[0]:
            message = "%s: tempo is now %d BPM. Press Space for a new claim code" % (label, variant)
        else:
            extra = (" (%d BPM)" % saved[0]) if saved[0] else ""
            detail = (" " + res["msg"] + ".") if res["done"] and res["msg"] else ""
            message = "%s complete!%s Claim code %s%s" % (label, detail, saved[1], extra)
        row = -1
    else:
        message = "%s: %s" % (label, res["msg"])
        row = res["row"]

    show("Loop Quest " + message)
    highlight(row)


def show(message):
    """Put our message in the hint bar, and log each new one to Script output."""
    t = now()
    if message != session.message:
        session.message = message
        session.shown_at = t
        ui.setHintMsg(message)
        print(message)
        return
    if t - session.shown_at >= REASSERT_SECONDS:
        session.shown_at = t
        try:
            if ui.getHintMsg() != message:
                ui.setHintMsg(message)
        except Exception:
            ui.setHintMsg(message)


def highlight(row):
    """Outline the Channel Rack row that needs fixing (best effort)."""
    try:
        t = now()
        if row >= 0:
            if row != session.highlight_row or t - session.highlight_at > HIGHLIGHT_MS / 2000.0:
                ui.crDisplayRect(0, row, STEPS, 1, HIGHLIGHT_MS)
                session.highlight_row = row
                session.highlight_at = t
        elif session.highlight_row >= 0:
            ui.crDisplayRect(0, 0, 0, 0, 0)
            session.highlight_row = -1
    except Exception:
        session.highlight_row = -1


def OnInit():
    session.reset()
    message = "Loop Quest v%d connected. Name a pattern with your quest tag (F2), like LQ01" % SCRIPT_VERSION
    session.message = message
    session.shown_at = now()
    ui.setHintMsg(message)
    print(message)


def OnDeInit():
    highlight(-1)


def OnIdle():
    session.ticks += 1
    session.clock += 0.02
    kind = QUESTS[session.tag]["kind"] if session.tag in QUESTS else ""
    if session.ticks < (TICKS_FAST if kind in FAST_KINDS else TICKS_SLOW):
        return
    session.ticks = 0
    try:
        check()
    except Exception as error:
        if not session.warned:
            session.warned = True
            print("Loop Quest: a check failed (%s). Note your FL Studio version "
                  "and report it." % error)
`,zs=`# Loop Quest Check (Piano Roll script)
#
# Checks Loop Quest's Piano Roll quests against the notes in this Piano Roll
# and shows claim codes. It never changes your notes.
# Unofficial fan project, not affiliated with or endorsed by Image-Line.
#
# Install: save this file as
#   Documents/Image-Line/FL Studio/Settings/Piano roll scripts/Loop Quest Check.pyscript
# Run: open the Piano Roll (F7) on the channel you wrote the notes in, then
#   in the Piano Roll menu choose Tools > Script list > Loop Quest Check.
#   Ctrl+Alt+Y runs the last script again. Needs FL Studio 21.1 or newer.
# Generated from fl/spec.json; edit the spec, not the QUESTS table below.

import flpianoroll as flp

QUESTS = {'lq05': {'check': 'scale',
          'kind': 'pianoroll',
          'minNotes': 6,
          'root': 0,
          'scale': [0, 2, 3, 5, 7, 8, 10],
          'title': 'Minor mood'},
 'lq06': {'check': 'chords',
          'chords': [{'name': 'C minor', 'pcs': [0, 3, 7]},
                     {'name': 'A flat major', 'pcs': [8, 0, 3]},
                     {'name': 'E flat major', 'pcs': [3, 7, 10]},
                     {'name': 'B flat major', 'pcs': [10, 2, 5]}],
          'kind': 'pianoroll',
          'title': "Rico's chords"},
 'lq07': {'check': 'slide808', 'kind': 'pianoroll', 'title': '808 slide'}}

NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"]
CODE_ALPHABET = "0123456789ABCDEFGHJKMNPQRSTVWXYZ"  # Crockford base32


def fnv1a32(text):
    h = 0x811C9DC5
    for byte in text.encode("utf-8"):
        h ^= byte
        h = (h * 0x01000193) & 0xFFFFFFFF
    return h


def mix32(h):
    h ^= h >> 16
    h = (h * 0x85EBCA6B) & 0xFFFFFFFF
    h ^= h >> 13
    h = (h * 0xC2B2AE35) & 0xFFFFFFFF
    h ^= h >> 16
    return h


def claim_code(quest_id, variant):
    h = mix32(fnv1a32("LQ1|%s|%d" % (quest_id, variant)))
    chars = []
    for _ in range(7):
        chars.append(CODE_ALPHABET[h & 31])
        h >>= 5
    body = "".join(chars)
    return "LQ-%s-%s" % (body[:3], body[3:])


def names_of(pcs):
    return ", ".join(NAMES[p] for p in sorted(pcs))


def read_notes():
    """Notes as dicts with pitch class and positions measured in 16th steps."""
    step = max(1.0, flp.score.PPQ / 4.0)
    notes = []
    for index in range(flp.score.noteCount):
        n = flp.score.getNote(index)
        if getattr(n, "muted", False):
            continue
        notes.append({
            "selected": bool(getattr(n, "selected", False)),
            "num": int(n.number),
            "pc": int(n.number) % 12,
            "start": n.time / step,
            "len": n.length / step,
            "slide": bool(getattr(n, "slide", False)),
        })
    notes.sort(key=lambda n: (n["start"], n["num"]))
    return notes


def check_scale(q, notes):
    plain = [n for n in notes if not n["slide"]]
    if len(plain) < q["minNotes"]:
        return False, "write at least %d notes (you have %d)" % (q["minNotes"], len(plain))
    for n in plain:
        if n["pc"] not in q["scale"]:
            return False, "%s isn't in C minor. Use %s" % (NAMES[n["pc"]], names_of(q["scale"]))
    first = [n for n in plain if n["start"] == plain[0]["start"]]
    if not any(n["pc"] == q["root"] for n in first):
        return False, "start the melody on %s" % NAMES[q["root"]]
    last = max(plain, key=lambda n: (n["start"], -n["num"]))
    if last["pc"] != q["root"]:
        return False, "end the melody on %s" % NAMES[q["root"]]
    return True, "melody works"


def check_chords(q, notes):
    for i, chord in enumerate(q["chords"]):
        low, high = i * 16 - 0.5, (i + 1) * 16 - 0.5
        in_bar = [n for n in notes if low <= n["start"] < high and not n["slide"]]
        if not in_bar:
            return False, "bar %d: add %s (%s)" % (i + 1, chord["name"], names_of(chord["pcs"]))
        have = set(n["pc"] for n in in_bar)
        want = set(chord["pcs"])
        if have != want:
            fixes = []
            if want - have:
                fixes.append("add " + names_of(want - have))
            if have - want:
                fixes.append("remove " + names_of(have - want))
            return False, "bar %d is %s: %s" % (i + 1, chord["name"], "; ".join(fixes))
    return True, "all %d chords right" % len(q["chords"])


def check_slide808(q, notes):
    plain = [n for n in notes if not n["slide"]]
    first = [n for n in plain if n["pc"] == 0 and abs(n["start"]) < 0.5 and n["len"] >= 5.5]
    if not first:
        return False, "start with a long low C on step 1 (6 steps or more)"
    f = first[0]
    slides = [n for n in notes if n["slide"] and n["pc"] == 3
              and 3.5 <= n["start"] <= 7.5 and n["start"] < f["start"] + f["len"]]
    if not slides:
        return False, "add a D# slide note (turn on slide) on steps 5 to 8, overlapping the C"
    if not [n for n in plain if n["pc"] == 0 and abs(n["start"] - 10) < 0.5]:
        return False, "add another C on step 11"
    return True, "808 slides into place"


CHECKS = {"scale": check_scale, "chords": check_chords, "slide808": check_slide808}


def run_checks():
    lines = []
    codes = []
    try:
        notes = read_notes()
    except Exception as error:
        notes = []
        lines.append("Couldn't read the notes (%s)." % error)
    if notes and all(n["selected"] for n in notes):
        # With a selection, FL hands scripts only the selected notes.
        lines.append("Only your selected notes were checked. Click an empty spot to "
                     "deselect, then run the check again (Ctrl+Alt+Y).")
    for tag in sorted(QUESTS):
        q = QUESTS[tag]
        ok, message = CHECKS[q["check"]](q, notes)
        if ok:
            code = claim_code(tag, 0)
            lines.append("%s %s: done! Claim code %s" % (tag.upper(), q["title"], code))
            codes.append((tag.upper() + " claim code", code))
        else:
            lines.append("%s %s: %s." % (tag.upper(), q["title"], message))
    return lines, codes


def createDialog():
    lines, codes = run_checks()
    form = flp.ScriptDialog("Loop Quest Check", "\\r\\n".join(lines))
    for name, code in codes:
        form.AddInputText(name, code)
    return form


def apply(form):

act name shown."} In Notepad, set Save as type to All files so the name doesn't end in .txt. On a Mac, use TextEdit's Format \u203A Make Plain Text first.</p><div class="controls">`+(t?I("zip","Download .zip",{ic:"download",primary:!0}):"")+(Nt(ss.device.name)?I("dl-device","device_LoopQuest.py",{ic:"download"}):"")+(Nt(ss.pr.name)?I("dl-pr","Loop Quest Check.pyscript",{ic:"download"}):"")+`</div><div class="controls">${I("copy-device","Copy MIDI script",{ic:"copy"})}${I("copy-pr","Copy Piano Roll script",{ic:"copy"})}${I("show","Show the code",{ic:"code",attrs:'aria-expanded="false"'})}</div><p class="note" id="fl-note" role="status"></p><div class="codes" hidden id="fl-codes"><div class="eyebrow">device_LoopQuest.py</div><pre class="code" id="code-device"></pre><div class="eyebrow">Loop Quest Check.pyscript</div><pre class="code" id="code-pr"></pre></div></li><li class="card"><h2>Install the MIDI script</h2><p>Put <span class="path">device_LoopQuest.py</span> in a folder named <span class="path">LoopQuest</span> inside:</p><p class="path block">Documents/Image-Line/FL Studio/Settings/Hardware/LoopQuest/</p><p>The .zip already has that folder: copy its <span class="path">Hardware</span> and <span class="path">Piano roll scripts</span> folders into <span class="path">Documents/Image-Line/FL Studio/Settings</span> and let them merge. Then restart FL Studio.</p></li><li class="card"><h2>Turn it on</h2><p>In FL, open <strong>Options \u203A MIDI settings</strong>. Select an input, click <strong>Enable</strong>, and set <strong>Controller type</strong> to <span class="path">Loop Quest (user)</span>.</p><p class="note">No MIDI keyboard? Use a free virtual port. Windows: install loopMIDI, add a port with its + button, then start FL. Mac: open Audio MIDI Setup \u203A Window \u203A Show MIDI Studio, double-click IAC Driver and tick \u201CDevice is online\u201D. If your keyboard already runs its own FL script, use a virtual port for Loop Quest so the keyboard keeps its controls.</p></li><li class="card"><h2>Check it works</h2><p>FL's hint bar (the message area in the top toolbar) shows <em>Loop Quest v${Jn} connected</em>. An older number means an older copy of the script: replace it with the download above. Now open <button type="button" class="linkish" data-go="quest:w0-3">Hello, FL</button>: select a pattern, press <kbd>F2</kbd>, name it <span class="path">LQ01</span> and press <kbd>Space</kbd>. The hint bar shows your first claim code.</p><p class="note">Messages also appear in <strong>View \u203A Script output</strong>, which is handy if the hint bar is hidden.</p></li><li class="card"><h2>Add the Piano Roll check</h2><p>Put <span class="path">Loop Quest Check.pyscript</span> in:</p><p class="path block">Documents/Image-Line/FL Studio/Settings/Piano roll scripts/</p><p>In a Piano Roll, open the menu and choose <strong>Tools \u203A Script list \u203A Loop Quest Check</strong>. It checks the Piano Roll quests against the notes you have open and shows a claim code for each one that passes. After the first run, <kbd>Ctrl</kbd><span class="plus">+</span><kbd>Alt</kbd><span class="plus">+</span><kbd>Y</kbd> runs it again. Piano Roll scripting needs FL Studio 21.1 or newer (FL Studio 2024 and later have it).</p></li></ol><section class="card"><h2>Quest tags</h2><p>Each real-FL quest has a tag. Name a pattern with the tag (F2) and the MIDI script switches to that quest.</p><div class="tablewrap"><table class="tags"><thead><tr><th>Tag</th><th>Quest</th><th>Checked by</th></tr></thead><tbody>${n}</tbody></table></div></section><section class="card"><h2>Troubleshooting</h2><dl class="faq"><dt>Loop Quest (user) isn't in the Controller type list</dt><dd>Check the folder path, and that the file is named exactly <span class="path">device_LoopQuest.py</span> (not .py.txt). Restart FL after moving it.</dd><dt>The hint bar says nothing</dt><dd>Make sure the MIDI input with Loop Quest is enabled. Open View \u203A Script output to see the script's messages and any errors.</dd><dt>Is the script working?</dt><dd>Name any pattern <span class="path">LQ00</span>. The hint bar says <em>Loop Quest v${Jn} is working</em> with your FL scripting API version (not the FL Studio version), tempo and channel count, and View \u203A Script output lists everything the script can read. If a line says <em>can't read</em>, include it when you report a problem.</dd><dt>My F-keys change volume or brightness</dt><dd>Hold Fn with the F-key, or switch your keyboard's function-key setting.</dd><dt>I'm on a Mac</dt><dd>Everything works the same; use Cmd where FL says Ctrl, and Option for Alt.</dd><dt>I moved FL's user data folder</dt><dd>The paths above assume the default. If you changed it in Options \u203A File settings, put the scripts in the same subfolders of that folder instead.</dd><dt>My code is rejected</dt><dd>Check the tag matches the quest, and for grooves that the tempo matches the brief. Letters I, L and O can be typed as 1 and 0.</dd></dl></section>`;let o=p=>{let d=e.querySelector("#fl-note");d&&(d.textContent=p)},a=p=>{let d=e.querySelector("#fl-codes"),u=e.querySelector('[data-act="show"]');p&&!e.querySelector("#code-device").textContent&&(e.querySelector("#code-device").textContent=Vs,e.querySelector("#code-pr").textContent=zs),d.hidden=!p,u&&u.setAttribute("aria-expanded",String(p))},r=p=>{let d=ss[p];Vn(d.text()).then(()=>o(`Copied. Paste it into a new text file named ${d.name}.`),()=>{a(!0),vs(e.querySelector(p==="device"?"#code-device":"#code-pr")),o("Couldn't copy automatically. The script is selected below: press Ctrl+C (Cmd+C on a Mac).")})},i=p=>()=>o(p),l=p=>{let d=p&&p.code;o(d==="declined"?"Download canceled.":d==="rate_limited"?"A save prompt is already open.":"Downloads aren't available here. Use the copy buttons instead.")};function c(p){let d=p.target.closest("[data-act]");if(!(!d||!e.contains(d)))switch(d.dataset.act){case"zip":jt(Vo,Da(_r),"application/zip").then(i("Saved. Unzip it and copy the two folde
